<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>中燃HSE题库 · 在线练习</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "PingFang SC", sans-serif; background:#f0f4f8; color:#1f2937; min-height:100vh; }
  .container { max-width:860px; margin:0 auto; padding:16px; padding-bottom:60px; }
  header { text-align:center; padding:20px 0 10px; }
  header h1 { font-size:20px; color:#0f3d7a; }
  .user-bar { display:flex; align-items:center; justify-content:center; gap:10px; margin:6px 0 16px; flex-wrap:wrap; }
  .user-chip { background:#eff6ff; border:1px solid #93c5fd; border-radius:20px; padding:4px 14px; font-size:13px; color:#1d4ed8; cursor:pointer; }
  .user-chip:hover { background:#dbeafe; }
  .btn-sm { border:none; border-radius:16px; padding:5px 14px; font-size:12px; cursor:pointer; }
  .btn-sm-ghost { background:#e5e7eb; color:#374151; }
  .btn-sm-ghost:hover { background:#d1d5db; }
  .btn-sm-primary { background:#2563eb; color:#fff; }
  .btn-sm-primary:hover { background:#1d4ed8; }

  .stats { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:16px 0; }
  .stat { background:#fff; border-radius:10px; padding:9px 16px; box-shadow:0 1px 3px rgba(0,0,0,.08); font-size:13px; color:#4b5563; }
  .stat b { font-size:18px; color:#0f3d7a; margin-right:3px; }

  .panel { background:#fff; border-radius:14px; box-shadow:0 2px 10px rgba(0,0,0,.08); padding:20px; }

  .mode-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-top:8px; }
  .mode-card { border:2px solid #e5e7eb; border-radius:12px; padding:16px 12px; text-align:center; cursor:pointer; transition:all .15s; background:#fafafa; -webkit-tap-highlight-color:transparent; }
  .mode-card:active { transform:scale(.97); }
  .mode-card .icon { font-size:28px; }
  .mode-card h3 { font-size:15px; margin:6px 0 4px; color:#111827; }
  .mode-card p { font-size:11px; color:#6b7280; }
  .mode-card .count { display:inline-block; margin-top:6px; font-size:11px; background:#dbeafe; color:#1d4ed8; border-radius:20px; padding:2px 10px; }

  .toolbar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .btn { border:none; border-radius:8px; padding:9px 18px; font-size:14px; cursor:pointer; transition:background .15s; -webkit-tap-highlight-color:transparent; }
  .btn:active { transform:scale(.97); }
  .btn-primary { background:#2563eb; color:#fff; }
  .btn-primary:hover { background:#1d4ed8; }
  .btn-ghost { background:#e5e7eb; color:#374151; }
  .btn-ghost:hover { background:#d1d5db; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }

  .progress-wrap { height:6px; background:#e5e7eb; border-radius:6px; overflow:hidden; margin-bottom:14px; }
  .progress-bar { height:100%; background:linear-gradient(90deg,#2563eb,#38bdf8); width:0; transition:width .3s; }
  .progress-text { font-size:13px; color:#6b7280; }

  .q-type { display:inline-block; font-size:11px; background:#eef2ff; color:#4338ca; border-radius:6px; padding:3px 10px; margin-bottom:8px; }
  .q-text { font-size:16px; line-height:1.9; margin-bottom:16px; font-weight:600; color:#111827; }

  .opt { display:flex; align-items:flex-start; gap:10px; border:2px solid #e5e7eb; border-radius:10px; padding:12px 14px; margin-bottom:10px; cursor:pointer; transition:all .12s; background:#fff; line-height:1.6; font-size:15px; -webkit-tap-highlight-color:transparent; }
  .opt:active:not(.locked) { transform:scale(.98); }
  .opt .letter { flex:none; width:24px; height:24px; border-radius:50%; background:#e5e7eb; color:#374151; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:13px; }
  .opt.selected { border-color:#2563eb; background:#eff6ff; }
  .opt.selected .letter { background:#2563eb; color:#fff; }
  .opt.correct { border-color:#16a34a; background:#ecfdf5; }
  .opt.correct .letter { background:#16a34a; color:#fff; }
  .opt.wrong { border-color:#dc2626; background:#fef2f2; }
  .opt.wrong .letter { background:#dc2626; color:#fff; }
  .opt.locked { cursor:default; }

  .feedback { border-radius:10px; padding:12px 14px; margin-top:12px; font-size:14px; line-height:1.7; display:none; }
  .feedback.show { display:block; animation:pop .25s ease; }
  .feedback.ok { background:#ecfdf5; border:1px solid #86efac; color:#166534; }
  .feedback.bad { background:#fef2f2; border:1px solid #fca5a5; color:#991b1b; }
  @keyframes pop { from { transform:scale(.96); opacity:0; } to { transform:scale(1); opacity:1; } }

  .nav { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }

  .result-box { text-align:center; padding:24px 10px; }
  .result-box .score { font-size:48px; font-weight:800; color:#0f3d7a; }
  .result-box .sub { color:#6b7280; margin:6px 0 18px; }
  .wrong-list { text-align:left; margin-top:16px; }
  .wrong-item { border:1px solid #fecaca; background:#fff7f7; border-radius:8px; padding:10px 14px; margin-bottom:8px; font-size:14px; line-height:1.6; }
  .wrong-item .a { color:#166534; font-weight:700; }

  .judge-btns { display:flex; gap:12px; }
  .judge-btn { flex:1; padding:14px; font-size:16px; font-weight:700; border:2px solid #e5e7eb; border-radius:10px; background:#fff; cursor:pointer; transition:all .12s; -webkit-tap-highlight-color:transparent; }
  .judge-btn:active:not(.locked) { transform:scale(.97); }
  .judge-btn.selected { border-color:#2563eb; background:#eff6ff; }
  .judge-btn.correct { border-color:#16a34a; background:#ecfdf5; color:#166534; }
  .judge-btn.wrong { border-color:#dc2626; background:#fef2f2; color:#991b1b; }
  .judge-btn.locked { cursor:default; }

  .multi-hint { font-size:13px; color:#6b7280; margin-bottom:10px; }
  .submit-row { margin-top:6px; }

  .fill-sentence { font-size:16px; line-height:2.4; color:#111827; }
  .blank-input { border:none; border-bottom:2px solid #94a3b8; background:#f8fafc; font-size:15px; font-family:inherit;
    text-align:center; padding:2px 4px; margin:0 2px; outline:none; border-radius:4px 4px 0 0; color:#0f3d7a; font-weight:600; max-width:100%; }
  .blank-input:focus { border-bottom-color:#2563eb; background:#eff6ff; }
  .blank-input.ok { border-bottom-color:#16a34a; background:#ecfdf5; color:#166534; }
  .blank-input.bad { border-bottom-color:#dc2626; background:#fef2f2; color:#991b1b; }
  .blank-answer { display:inline-block; font-size:12px; color:#166534; font-weight:700; margin-left:2px; white-space:nowrap; }
  .fill-tools { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .fill-fullext { margin-top:12px; font-size:14px; color:#166534; background:#ecfdf5; border:1px solid #86efac; border-radius:8px; padding:10px 14px; line-height:1.8; display:none; }
  .fill-fullext.show { display:block; }

  /* 登录 & QR 弹窗 */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal { background:#fff; border-radius:16px; padding:28px 24px; max-width:380px; width:90%; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.15); animation:pop .25s ease; }
  .modal h2 { font-size:18px; color:#0f3d7a; margin-bottom:6px; }
  .modal p { font-size:13px; color:#6b7280; margin-bottom:18px; }
  .modal input[type=text] { width:100%; padding:12px 14px; font-size:16px; border:2px solid #d1d5db; border-radius:10px; outline:none; text-align:center; }
  .modal input[type=text]:focus { border-color:#2563eb; }
  .modal .btn { margin-top:14px; width:100%; padding:12px; font-size:16px; }
  .modal .qr-wrap { margin:16px 0; }
  .modal .qr-wrap canvas, .modal .qr-wrap img { border-radius:10px; border:1px solid #e5e7eb; }
  .modal .qr-url { word-break:break-all; font-size:12px; color:#6b7280; margin-top:10px; background:#f8fafc; border-radius:8px; padding:8px; }
  .modal .close-btn { position:absolute; top:12px; right:14px; font-size:22px; cursor:pointer; color:#9ca3af; width:32px; height:32px; line-height:32px; text-align:center; border-radius:50%; background:#f3f4f6; }
  .hidden { display:none !important; }
</style>
</head>

<div class="container">
  <header>
    <h1>中燃集团 HSE 管理体系题库 · 在线练习</h1>
  </header>
  <div class="user-bar" id="userBar"></div>
  <div class="stats" id="statsBar"></div>

<script>

荐“情景构建”式应急演练","D":"公司级演练由分管安全工作负责人负责组织实施"},"answer":"D"},{"q":"关于应急演练频次，下列说法不正确的（ ）。","options":{"A":"公司级演练1次/半年","B":"部门级演练1次/季度","C":"场站演练1次/月","D":"班组演练1次/月"},"answer":"A"},{"q":"下列不属于HSE记录的是（ ）。","options":{"A":"年度HSE目标及计划","B":"重大风险清单","C":"应急演练评估报告","D":"考勤记录"},"answer":"D"},{"q":"下列有关岗位安全手册管理，不正确的是（ ）。","options":{"A":"管理岗位的岗位安全手册到期后由负有安全监察责任的部门统一保存，保存时限为 3 年。","B":"操作岗位的岗位安全手册到期后由负有安全监察责任的部门统一保存，保存时限为 3 年","C":"岗位安全手册应全面覆盖本岗位相关的全部安全工作和职责","D":"岗位安全手册分两类，一类是管理岗位的岗位安全手册；一类是操作岗位的岗位安全手册"},"answer":"B"},{"q":"下列有关岗位安全手册管理，正确的是（ ）。","options":{"A":"管理岗位的岗位安全手册为业务活动安全卡汇编。","B":"管理岗位的岗位安全手册有效期为 3 年","C":"操作岗位的岗位安全手册有效期为三年","D":"岗位安全手册应全面覆盖本岗位相关的全部安全工作和职责，分两类"},"answer":"D"},{"q":"有关安全检查，下列说法正确的是（ ）。","options":{"A":"项目公司安全监察部门负责专业安全检查","B":"场站、班组每月组织 1 次综合性安全检查","C":"岗位操作人员值班岗位安全巡查至少 4 小时一次","D":"法定假日前安全监察部必须组织开展综合安全检查"},"answer":"D"},{"q":"有关风险分级管控管理中，说法正确的是（ ）。","options":{"A":"安全监察部负责制定各业务的风险识别与评价工作指引，明确各业务重大风险标准","B":"项目公司至少每年开展一次风险辨识与评价","C":"风险控制措施包括工程技术措施、管理措施两方面内容","D":"项目公司主要负责人应承包本单位最大风险点"},"answer":"D"},{"q":"有关风险分级管控管理中，说法正确的是（ ）。","options":{"A":"安全监察部负责建立各业务重大风险清单并汇编形成公司重大风险清单，同时督促落实","B":"项目公司分管安全工作负责人承包本单位最大风险点","C":"各业务的重大风险清单，应明确风险点的责任人和管控措施","D":"每月至少对承包的风险点进行一次检查"},"answer":"C"},{"q":"有关隐患排查治理管理中，说法正确的是（ ）。","options":{"A":"排查的范围包括所有与生产经营相关的场所、环境、人员、设备设施和作业","B":"安全监察部负责制定各业务模块的隐患排查、分级工作指引","C":"对重大隐患，项目公司分管安全工作负责人亲自督办整改","D":"对重大隐患，项目公司安全监察部负责人亲自督办整改"},"answer":"A"},{"q":"有关领导干部安全履职考评管理，下列说法正确的是（ ）。","options":{"A":"安全监察部组织制定对各部门经理的安全履职考评办法","B":"项目公司分管安全工作负责人组织制定对其他经管层干部的安全履职考评办法","C":"安全监察站每年对所辖营业额较高项目公司主要负责人、分管安全负责人开展 1 次安全履职考评。","D":"集团每年对安全管理水平较差的项目公司主要负责人、分管安全负责人开展安全履职考评"},"answer":"D"},{"q":"公司实行全员安全记分，主要负责人为推动全员安全记分的（ ）。","options":{"A":"第一责任人","B":"第二负责人","C":"主要考评人员","D":"主要监督人员"},"answer":"A"},{"q":"建立安全考核奖惩管理制度，制度要求中应明确安全记分结果与员工的（ ）、晋级、评先、调薪和奖惩挂钩。","options":{"A":"提拔","B":"晋升","C":"评选","D":"降薪"},"answer":"B"},{"q":"有关项目公司 HSE 管理评级管理，下列说法正确的是（ ）。","options":{"A":"项目公司、安全监察站、集团，三者对项目公司 HSE 管理评级标准呈现由低到高趋严的趋势","B":"安全监察中心每年对所辖营业额较高项目公司开展 "options":{"A":"可能存在的职业病危害及后果","B":"工作过程中个人应采取的防护措施","C":"工作过程中个人应采取的应急措施","D":"安全操作规程"},"answer":["A","B","C"]},{"q":"关于职业健康体检，说法正确的是（ ）。","options":{"A":"项目公司应安排从事接触职业病危害作业的人员进行上岗前的职业健康体检","B":"项目公司应安排从事接触职业病危害作业的人员进行在岗期间的职业健康体检","C":"项目公司应安排从事接触职业病危害作业的人员进行离岗时的职业健康体检","D":"项目公司应安排从事接触职业病危害作业的人员每年进行一次职业健康体检。"},"answer":["A","B","C"]},{"q":"有关七大高危作业管理，说法正确的是（ ）。","options":{"A":"高处作业必须要有专项方案","B":"临时用电必须要有专项方案","C":"带气作业必须要有专项方案","D":"动火作业必须要有专项方案"},"answer":["C","D"]},{"q":"有关七大高危作业作业票管理，说法正确的是（ ）。","options":{"A":"带气作业由施工人员办理作业票","B":"临时用电无需办理作业票","C":"受限空间作业由作业单位办理作业票","D":"动火作业由施工单位办理作业票"},"answer":["B","C"]},{"q":"有关安全生产委员会，下列说法正确的是（ ）。","options":{"A":"区域、事业部、专业公司、项目公司必须成立安委会，安委会主任由分管安全主要负责人担任","B":"安委会成员必须包括各部门安全员，要有成立文件","C":"每季度至少召开一次安委会会议","D":"每年召开一次年度安全工作会议"},"answer":["C","D"]},{"q":"有关事故事件管理，说法正确的是（ ）。","options":{"A":"事发单位在发生第一时间（2小时内）向区域管理中心（事业部/专业公司）、集团业务主管部门、集团安全监察部报告","B":"事故事件发生后，各单位应按照《安全事件快速经验反馈制度》，落实事故整改和预防措施，做到事故原因没有查清不放过、事故责任者和群众没有受到教育不放过、没有采取切实可行的防范措施不放过、事故责任者没有受到严肃处理不放过","C":"发生事故事件后，事发单位在发生第一时间（1 小时内）向区域管理中心（事业部/专业公司）报告，视情况向集团业务主管部门、集团安全监察部报告","D":"项目公司应建立事故事件报告程序，明确事故事件内外部报告的责任人、时限、内容等"},"answer":["B","D"]},{"q":"有关践行“五个一”，下列正确的是（ ）。","options":{"A":"项目公司主要负责人落实安全工作“五个一”，其中包括每月进行一次安全宣讲","B":"项目公司分管安全工作负责人落实安全工作“五个一”，其中包括每周组织或参加一次安全会议","C":"项目公司分管运营、客服、工程负责人安全工作“五个一”，其中包括每月必须参加月度安全会议","D":"项目公司分管安全工作负责人安全工作“五个一”，其中包括每年组织一次应急演练。"},"answer":["B","C"]},{"q":"关于应急管理，下列说法正确的是（ ）。","options":{"A":"项目公司应编制现场处置方案，明确紧急状态下岗位人员 “做什么”、“怎么做”。","B":"每年预案至少修订 1 次，如果应急程序、资源发生重大变更的，或者地方政府有要求的，要及时修订","C":"各级应急预案必须通过 OA 正式发布，并传达到每个岗位","D":"综合应急预案必须向政府备案"},"answer":["B","C","D"]},{"q":"下列有关岗位安全手册管理，正确的是（ ）。","options":{"A":"管理岗位的岗位安全手册到期后由负有安全监察责任的部门统一保存，保存时限为 3 年。","B":"操作岗位的岗位安全手册到期后由负有安全监察责任的部门统一保存，保存时限为 3 年","C":"岗位安全手册应全面覆盖本岗位相关的全部安全工作和职责","D":"岗位安全手册分两类，一类是管理岗位的岗位安全手册；一类是操作岗位的岗位安全手册。"},"answer":["A","C","D"]},{"q":"下列哪些不属于一级用户隐患（ ）。","options":{"A":"户内管道擅自改动","B":"用气设施生锈极其严重","C":"多种火源混用","D":"胶管中间有接口"},"answer":["A","B","D"]},{"q":"关于职业健康管理，说法正确的是（ ）。","options":{"A":"项目公司应每半年对职业病危害因素识别和评估1次，并建立职业病危害因素清单","B":"职业病危害因素清单应列出产生职业病危害因素地点、浓（强）度和所采取的控制措施","C":"项目公司应对职业病防护设施进行检查、维护和维修，确保其完好投用","D":"项目公司仅在与员工签订劳动合同时告知其工作过程中可能存在的职业病危害及后果，换岗时无需再告知。"},"answer":["B","C"]},{"q":"有关风险分级管控管理中，说法正确的是（ ）。","options":{"A":"安全监察部负责制定各业务的风险识别与评价工作指引，明确各业务重大风险标准","B":"项目公司至少每半年开展一次风险辨识与评价","C":"风险控制措施包括包括工程技术措施、管理措施两方面内容","D":"项目公司主要负责人应承包本单位最大风险点"},"answer":["B","D"]},{"q":"下列（ ）承包商安全管理要求描述错误。","options":{"A":"承包商的分包商视同承包商进行管理","B":"禁止总包单位将主体工程分包，分包项目可依据工程进度适当再分包","C":"项目公司应对承包商现场作业进行检查监督，并记录和反馈检查监督结果","D":"项目公司每季度对承包商进行安全绩效评价，建立承包商“黑名单”，禁止使用列入“黑名单”的承包商。。"},"answer":["B","D"]},{"q":"有关员工岗位安全履职考评管理，下列说法有误的是（ ）。","options":{"A":"项目公司中层干部对所管辖的员工的业务活动安全卡和岗位安全手册的掌握和执行情况，每周考评一次","B":"项目公司分管领导对所管辖部门的中层干部的岗位安全手册的掌握和执行情况，每月考评一次","C":"项目公司分管领导对所管辖部门的中层干部的岗位安全手册的掌握和执行情况，每季度考评一次。","D":"安全监察站每年对所辖项目公司主要负责人、分管安全负责人开展 1 次全覆盖的安全履职考评。"},"answer":["A","B"]},{"q":"有关隐患排查治理管理中，说法正确的是（ ）。","options":{"A":"排查的范围包括所有与生产经营相关的场所、环境、人员、设备设施和作业","B":"安全监察部负责制定各业务模块的隐患排查、分级工作指引","C":"对重大隐患，项目公司分管安全工作负责人亲自督办整改","D":"对重大隐患，项目公司主要负责人亲自督办整改"},"answer":["A","D"]},{"q":"采用新工艺、（ ）、使用新设备，必须对相关生产、作业人员进行专项安全培训。","options":{"A":"新员工","B":"新技术","C":"新材料","D":"新工具"},"answer":["B","C"]},{"q":"有关安全检查，下列说法不正确的是（ ）。","options":{"A":"项目公司安全监察部门负责专业安全检查","B":"场站、班组每月组织 1 次综合性安全检查","C":"岗位操作人员值班岗位安全巡查至少 4 小时一次","D":"法定假日前运营部必须组织开展综合安全检查"},"answer":["A","B","C","D"]},{"q":"有关应急演练，说法正确的（ ）。","options":{"A":"公司级演练推荐采用“剧本”式应急演练","B":"场站组织演练推荐“双盲”式应急演练","C":"各部门组织开展的演练推荐“情景构建”式应急演练","D":"公司级演练由主要负责人负责组织实施"},"answer":["A","B","C","D"]},{"q":"下列（ ）为二级带气作业","options":{"A":"在场站储罐上带气更换设备","B":"在运行的加臭机上维修","C":"在输气管网dn200 PE 管上带气接驳","D":"二次挂表"},"answer":["C","D"]},{"q":"下列作业哪些属于高危作业（ ）","options":{"A":"开挖管网埋地沟槽","B":"入户安检","C":"管网巡线进入深度1.5m的大型阀井进行巡查","D":"场站巡检"},"answer":["A","C"]},{"q":"下列（ ）属于气源场站重要生产设备。","options":{"A":"储罐","B":"汽化器","C":"加臭机","D":"安全阀"},"answer":["A","B","C"]},{"q":"有关风险分级管控管理中，说法错误的是（ ）。","options":{"A":"安全监察部负责制定各业务的风险识别与评价工作指引，明确各业务重大风险标准","B":"项目公司至少每年开展一次风险辨识与评价","C":"风险控制措施包括工程技术措施、管理措施、应急措施和个体防护措施","D":"项目公司主要负责人应承包本单位最大风险点"},"answer":["A","B"]},{"q":"员工安全记分结果与员工的（ ）挂钩。","options":{"A":"评先","B":"调薪","C":"奖惩","D":"项目公司全体员工的绩效工资"},"answer":["A","B","C"]},{"q":"项目公司应明确重要工艺参数，下列（ ）为重要工艺参数。","options":{"A":"压力","B":"液位","C":"流量","D":"加臭量"},"answer":["A","B","C","D"]},{"q":"项目公司建立管网档案，包括（ ）。","options":{"A":"管网图纸","B":"测量成果","C":"管网变更和维修检测记录","D":"电子管网图"},"answer":["A","B","C","D"]},{"q":"有权审批动火方案的是：","options":{"A":"总经理","B":"分管安全领导","C":"业务分管领导","D":"安监部经理","E":"业务部门经理 F、站长"},"answer":["A","C","E"]},{"q":"动火现场负责人可以由（ ）担任：","options":{"A":"施工单位现场负责人","B":"项目公司部门负责人","C":"项目公司分管领导","D":"项目公司指定人员"},"answer":["B","D"]},{"q":"哪一级带气作业需要编制作业方案：","options":{"A":"一级","B":"二级","C":"三级"},"answer":["A","B"]},{"q":"带气作业方案审批/审核内容包括：","options":{"A":"作业是否理","B":"工况设定是否合理","C":"地点是否合适","D":"安全风险对应的防控措施是否适宜"},"answer":["A","B","C","D"]},{"q":"每次带气作业，作业人都要：","options":{"A":"接受安全教育","B":"穿戴防静电工作服","C":"穿用空气呼吸器","D":"不携带火种"},"answer":["A","B","D"]},{"q":"带气作业的环境做到：","options":{"A":"良好通风","B":"作业前燃气在空气中的浓度不超过燃气爆炸极限的50%","C":"作业区与周边有效隔离","D":"夜间应设置警示灯"},"answer":["A","C","D"]},{"q":"带气作业应急应做到：","options":{"A":"有预案","B":"配备灭火器材","C":"向应急部门备案","D":"向住建部门备案"},"answer":["A","B"]},{"q":"吊装作业可以由（ ）发起","options":{"A":"工程公司","B":"项目公司","C":"监理单位"},"answer":["A","B"]},{"q":"吊装作业关于人需要落实的安全措施：","options":{"A":"安全教育","B":"穿防静电服","C":"人证相符","D":"监护到位"},"answer":["A","C","D"]},{"q":"吊装作业关于物需要落实的安全措施：","options":{"A":"机索合格","B":"配重三角木齐全","C":"吊索不触锐糙物","D":"电器开关防爆"},"answer":["A","B","C"]},{"q":"吊装作业关于环境需要落实的安全措施；","options":{"A":"设置警示防护区","B":"排除高处隐患","C":"夜间照明达到要求","D":"吊装支撑地面坚实，支腿牢固"},"answer":["A","B","C"]},{"q":"吊装作业关于管理需要落实的安全措施：","options":{"A":"进行试吊","B":"负荷检查","C":"设置逃生通道"},"answer":["A","B"]},{"q":"吊装作业票的签发由：","options":{"A":"项目公司负责人","B":"现场负责人","C":"监理人员","D":"作业人"},"answer":["B","C","D"]},{"q":"“十不吊”其中包括：","options":{"A":"吊物重量不明","B":"现场光线阴暗","C":"五级强风","D":"斜牵斜挂"},"answer":["A","B","D"]},{"q":"动土作业可以由（ ）发起","options":{"A":"工程公司","B":"项目公司","C":"监理单位"},"answer":["A","B"]},{"q":"动土作业关于人需要落实的安全措施：","options":{"A":"安全教育","B":"个体防护","C":"人证相符","D":"监护到位"},"answer":["A","B","C","D"]},{"q":"动土作业关于物需要落实的安全措施：","options":{"A":"机械合格","B":"警示围护齐全","C":"因土质有明确支、护措施","D":"明确沟、坑边堆土限制规定"},"answer":["A","B","C","D"]},{"q":"动土作业关于环境需要落实的安全措施；","options":{"A":"查清地下管线沟渠等情况","B":"做好地面及地下排水","C":"恶劣天气的事中事后处置","D":"在距其它线缆1米内不能作业"},"answer":["A","B","C"]},{"q":"动土作业关于管理需要落实的安全措施：","options":{"A":"与相邻管线等产权单位商妥","B":"两两人工作业人员保持安全间距","C":"设置逃生通道","D":"不在作业沟、坑休息"},"answer":["A","B","C","D"]},{"q":"项目公司现场检查人对动土作业具有的职责：","options":{"A":"检查作业人的人证相符","B":"检查是否现场设置了必要的逃生通道","C":"检查作业票办理","D":"抽查作业现场"},"answer":["A","B","C","D"]},{"q":"动土作业票必须哪些岗位签字方为有效：","options":{"A":"作业方现场负责人","B":"监理人员","C":"作业人","D":"项目公司复核人"},"answer":["A","B","C"]},{"q":"高处作业可以由（ ）发起？","options":{"A":"工程公司","B":"项目公司","C":"监理单位"},"answer":["A","B"]},{"q":"编制高处作业方案至少应包括：","options":{"A":"作业人身心健康","B":"作业事项","C":"设施设备","D":"安全风险及防范措施"},"answer":["A","B","C","D"]},{"q":"高处作业关于人需要落实的安全措施：","options":{"A":"安全教育","B":"个体防护","C":"人证相符","D":"监护到位"},"answer":["A","B","C","D"]},{"q":"高处作业关于物需要落实的安全措施：","options":{"A":"器材合格","B":"护具达标","C":"25米的高度之间联络应用通讯工具","D":"安全绳作业绳等不与锐糙物接触"},"answer":["A","B","D"]},{"q":"高处作业关于环境需要落实的安全措施；","options":{"A":"作业区地面设警示防护区不小于直径4米","B":"作业无触电风险","C":"适合的天气条件","D":"禁止上下交叉作业，必须交叉则应采取可靠的隔离措施"},"answer":["B","C","D"]},{"q":"高处作业关于管理需要落实的安全措施：","options":{"A":"卷扬机严禁载人","B":"手持工具有防脱落措施","C":"禁止移动有人的移动式脚手架","D":"安全带、安全绳、作业绳、索具、护栏等强度达标"},"answer":["A","B","C"]},{"q":"高处作业票应经下列岗位人员签字方有效：","options":{"A":"作业方现场负责人","B":"监理人员","C":"作业人员","D":"项目公司现场负责人"},"answer":["A","B","C"]},{"q":"临时用电作业正确的安全措施：","options":{"A":"安全教育","B":"个体防护","C":"人证相符","D":"安装合格"},"answer":["A","B","C","D"]},{"q":"临时用电作业关于环境需要落实的安全措施；","options":{"A":"经检测，环境不具有爆炸性","B":"在可能有燃气泄漏的场所，所有临时用电设备、装置均为相适合的防爆产品","C":"暴露装置的场所无雨雪、雷电发生","D":"接用电装置附近易燃易爆、腐蚀物堆放"},"answer":["A","B","C","D"]},{"q":"正确的临时用电线架设方式","options":{"A":"架设在脚手架上","B":"悬空架设","C":"架在树上","D":"沿墙敷设"},"answer":["B","D"]},{"q":"受限空间作业申请审批重点什么内容","options":{"A":"作业内容","B":"时间","C":"地点（部位）","D":"应急预案"},"answer":["A","B","C","D"]},{"q":"受限空间作业票经（ ）签发后生效。","options":{"A":"作业人","B":"监护人","C":"监理人员","D":"现场负责人","E":"项目公司业务负责人 F、项目公司检查人"},"answer":["A","B","D"]},{"q":"主要负责人安全培训应当包括下列内容（ ）","options":{"A":"国家安全生产方针、政策和有关安全生产的法律、法规、规章及标准；","B":"安全生产管理基本知识、安全生产技术、安全生产专业知识；","C":"重大危险源管理、重大事故防范、应急管理和救援组织以及事故调查处理的有关规定；","D":"职业危害及其预防措施；","E":"仅需学习国内先进的安全生产管理经验。"},"answer":["A","B","C","D"]},{"q":"安全生产管理人员安全培训应当包括下列内容（ ）","options":{"A":"国家安全生产方针、政策和有关安全生产的法律、法规、规章及标准；","B":"安全生产管理、安全生产技术、职业卫生等知识；","C":"伤亡事故统计、报告及职业危害的调查处理方法；","D":"应急管理、应急预案编制以及应急处置的内容和要求；","E":"典型事故和应急救援案例分析。"},"answer":["A","B","C","D","E"]},{"q":"项目公司主要负责人应取得下列哪些安全证件：（ ）","options":{"A":"安全生产知识和管理能力考核合格证","B":"燃气经营企业从业人员专业培训考核合格证书","C":"特种设备安全管理 A证","D":"快开门式压力容器操作 R1证","E":"特种设备焊接作业证"},"answer":["A","B"]},{"q":"项目公司安全管理人员应取得下列哪些安全证件：（ ）","options":{"A":"安全生产知识和管理能力考核合格证","B":"燃气经营企业从业人员专业培训考核合格证书","C":"特种设备安全管理 A证","D":"快开门式压力容器操作 R1证","E":"特种设备焊接作业证"},"answer":["A","B"]},{"q":"项目公司燃气运行工种应取得下列哪些安全证件：（ ）","options":{"A":"燃气输配场站工证","B":"液化石油气库站工证","C":"压缩天然气场站工证","D":"液化天然气储运工证","E":"汽车加气站操作工证"},"answer":["A","B","C","D","E"]},{"q":"项目公司特种作业人员应取得下列哪些安全证件：（ ）","options":{"A":"电工证","B":"焊工证","C":"高处作业证","D":"快开门式压力容器操作 R1证","E":"特种设备焊接作业证"},"answer":["A","B","C"]},{"q":"项目公司特种设备管理及作业人员应取得下列哪些安全证件：（ ）","options":{"A":"安全生产知识和管理能力考核合格证","B":"燃气经营企业从业人员专业培训考核合格证书","C":"特种设备安全管理 A证","D":"快开门式压力容器操作 R1证","E":"特种设备焊接作业证"},"answer":["C","D","E"]},{"q":"对项目公司主要负责人、职业卫生管理人员的职业卫生培训，应当包括下列主要内容：（ ）","options":{"A":"职业卫生相关法律、法规、规章和国家职业卫生标准；","B":"职业病危害预防和控制的基本知识；","C":"职业卫生管理相关知识；","D":"国家卫生健康委规定的其他内容。"},"answer":["A","B","C","D"]},{"q":"事故事件发生后，各单位应按照《中燃集团安全事故管理制度》，落实事故整改和预防措施，下列做法正确的是（ ）","options":{"A":"做到事故原因没有查清不放过","B":"事故责任者和群众没有受到教育不放过","C":"没有采取切实可行的防范措施不放过","D":"事故责任者没有受到严肃处理不放过。","E":"未进行赔偿不放过"},"answer":["A","B","C","D"]}],"judge":[{"q":"所有动火作业都需要办理作业票。","answer":true},{"q":"动火作业申请可由项目公司和工程公司发起。","answer":false},{"q":"总经理审批一、二级动火作业方案。","answer":false},{"q":"安监部经理参加签发动火作业票。","answer":false},{"q":"动火作业需要三个规定的岗位共同参与。","answer":false},{"q":"动火作业需要项目公司检查人不定时抽查。","answer":false},{"q":"二级带气作业方案由分管安全领导审批。","answer":false},{"q":"带气作业现场负责人由工程公司人员担任。","answer":false},{"q":"组织落实现场安全措施由施工方现场负责人承担。","answer":false},{"q":"签发带气作业票必须包括作业人和项目公司检查人。","answer":false},{"q":"运行的PE管上作业均不属于级别内的带气作业。","answer":false},{"q":"二级带气作业只需要编制通用方案，不需要编制专项方案。","answer":false},{"q":"动火作业是指直接或间接在禁火区内产生火焰、火花或炽热表面的作业，包括使用电焊(不包括PE管焊接)、气焊（割）、电钻等进行的作业。","answer":true},{"q":"动火作业分三级。","answer":true},{"q":"高压、次高压燃气管道及设备带气动火作业属于特级动火。","answer":true},{"q":"场站爆炸危险区域内燃气管道、设备的动火作业属于特级动火。","answer":true},{"q":"中压燃气管道及设备带气动火作业属于一级动火。","answer":true},{"q":"场站爆炸危险区域内除特级动火作业以外的动火作业属于一级动火。","answer":true},{"q":"燃气管道、设备经过隔断和置换等安全措施处理后实施的动火作业属于一级动火。","answer":true},{"q":"除特级动火作业和一级动火作业以外的动火作业属于二级动火。","answer":true},{"q":"遇节假日、公休日、夜间或其他特殊情况，动火作业应升级管理。","answer":true},{"q":"高处作业是指在距坠落基准面2m及以上的悬空、攀登、临边、洞口、操作平台、安全网搭设等作业。","answer":true},{"q":"高处作业分四级，根据作业区段和存在的客观危险因素具体分级管理。","answer":true},{"q":"动土作业是指挖土、挖沟、打桩、钻探、坑探、地锚入土深度在0.5m以上的作业。","answer":true},{"q":"动土作业分两级。","answer":true},{"q":"入土深度1.2m及以上的动土作业，或使用挖掘机等施工机械的动土作业属于一级动土作业。","answer":true},{"q":"入土深度0.5-1.2m的动土作业属于二级动土作业。","answer":true},{"q":"带气作业是指在气源场站内带气更换设备和置换，输气管网的置换、带气接管、更换设备、燃气管道抽（加）盲板等有可能造成燃气泄漏的作业。","answer":true},{"q":"带气祖业分两级。","answer":true},{"q":"在气源场站重要生产设备（如储罐、气化器、增压器、加臭机、主要输气（液）管道等）上带气更换设备属于一级带气作业。","answer":true},{"q":"输气管网（DN200及以上钢管、DN 300及以上PE管）的带气作业属于一级带气作业。","answer":true},{"q":"高压管道的带气作业属于一级带气作业。","answer":true},{"q":"PE管马鞍开口作业属于一级带气作业。","answer":true},{"q":"在气源场站一般生产设备（如DN100以下输气管道等）上带气更换设备属于二级带气作业。","answer":true},{"q":"输气管网（DN200以下钢管、DN300以下PE管）的带气作业属于二级带气作业。","answer":true},{"q":"二次挂表属于二级带气作业。","answer":true},{"q":"受限空间作业是指进出口受限、通风不良；可能存在易燃易爆、有毒有害物质聚集或缺氧；封闭或半封闭的设施及场所，如槽、罐、深度超过1.2m的阀井、管道、地下水池以及其他封闭、半封闭场所。","answer":true},{"q":"吊装作业是指利用各种吊装机具将设备、工件、器具、材料等吊起，使其发生位置变化的作业过程（利用吊装机具下管过程除外）。","answer":true},{"q":"按照吊物质量m不同，吊装作业分为三级。","answer":true},{"q":"一级吊装作业：m>100t。","answer":true},{"q":"二级吊装作业：40t≤m≤100t。","answer":true},{"q":"三级吊装作业：m<40t。","answer":true},{"q":"临时用电作业是指正式运行的电源上所接的非永久性用电。","answer":true},{"q":"PE管焊接中，只有热熔焊接需要专用夹具。","answer":false},{"q":"吊装作业申请只由施工公司发起。","answer":false},{"q":"临时用电方案应经监理人员批准。","answer":false},{"q":"临时用电作业落实安全措施，根据流程，主要从“人物环管应急”五个方面着手。","answer":false},{"q":"站在椅子上，电工接线可以不穿绝缘鞋。","answer":false},{"q":"每次移动用电设备均需要切断电源。","answer":true},{"q":"用电人结束用电，即通知电工拆除用电系统。","answer":false},{"q":"发生电气火灾，应用泡沫灭火器灭火。","answer":false},{"q":"项目公司应对承包商（含承运商、技术服务商）的安全资质和专业资质进行审查、复核，合格后方可入场。","answer":true},{"q":"电工必须持有相关有效证件。","answer":true},{"q":"项目公司应对所有的入场承包商人员进行安全培训，考试合格后办理入场证。","answer":true},{"q":"禁止总包单位将主体工程分包，禁止分包项目再分包，禁止违法转包。","answer":true},{"q":"受限空间作业票必须经规定的五个岗位签发。","answer":false},{"q":"受限空间作业应由监理人员全程监护。","answer":false},{"q":"受限空间作业应编制应急预案。","answer":true},{"q":"受限空间作业环境监测由项目公司现场检查人负责。","answer":false},{"q":"受限空间作业票有效时间不超过24小时。","answer":true},{"q":"阀井、地下水池等出口应设置安全爬梯、安全绳等救生设施。","answer":true},{"q":"无法自然通风的受限空间，应进行强制通风。","answer":true}],"fill":[{"segs":[{"t":"text","v":"项目公司领导的安全培训以"},{"t":"blank","v":"法律法规"},{"t":"text","v":"、"},{"t":"blank","v":"本岗位的安全职责"},{"t":"text","v":"为主，着重强化安全意识和责任意识。"}],"blanks":["法律法规","本岗位的安全职责"],"full":"项目公司领导的安全培训以法律法规、本岗位的安全职责为主，着重强化安全意识和责任意识。"},{"segs":[{"t":"text","v":"项目公司领导至少每年接受 "},{"t":"blank","v":"1 次"},{"t":"text","v":"集团组织的安全培训，时间不少于"},{"t":"blank","v":"4学时"},{"t":"text","v":"。"}],"blanks":["1 次","4学时"],"full":"项目公司领导至少每年接受 1 次集团组织的安全培训，时间不少于4学时。"},{"segs":[{"t":"text","v":"项目公司领导每年再培训时间不得少于"},{"t":"blank","v":"16学时"}],"blanks":["16学时"],"full":"项目公司领导每年再培训时间不得少于16学时"},{"segs":[{"t":"text","v":"管理人员的安全培训以集团和本单位的安全管理制度、"},{"t":"blank","v":"本岗位的安全职责"},{"t":"text","v":"为主，强化责任意识、掌握安全管理方法、增强安全技能。"}],"blanks":["本岗位的安全职责"],"full":"管理人员的安全培训以集团和本单位的安全管理制度、本岗位的安全职责为主，强化责任意识、掌握安全管理方法、增强安全技能。"},{"segs":[{"t":"text","v":"项目公司至少每年组织"},{"t":"blank","v":"1次"},{"t":"text","v":"管理人员的安全培训。"}],"blanks":["1次"],"full":"项目公司至少每年组织1次管理人员的安全培训。"},{"segs":[{"t":"text","v":"各级管理人员每年再培训时间不得少于"},{"t":"blank","v":"16学时"},{"t":"text","v":"。"}],"blanks":["16学时"],"full":"各级管理人员每年再培训时间不得少于16学时。"},{"segs":[{"t":"text","v":"操作人员的安全培训以本岗位的"},{"t":"blank","v":"安全操作规程"},{"t":"text","v":"、"},{"t":"blank","v":"安全职责"},{"t":"text","v":"为主，强化安全意识、提升风险识别能力、安全操作能力、应急处置和自救互救能力。"}],"blanks":["安全操作规程","安全职责"],"full":"操作人员的安全培训以本岗位的安全操作规程、安全职责为主，强化安全意识、提升风险识别能力、安全操作能力、应急处置和自救互救能力。"},{"segs":[{"t":"text","v":"采用新工艺、新技术、新材料、使用新设备，必须对相关生产、作业人员进行"},{"t":"blank","v":"专项安全培训"},{"t":"text","v":"。"}],"blanks":["专项安全培训"],"full":"采用新工艺、新技术、新材料、使用新设备，必须对相关生产、作业人员进行专项安全培训。"},{"segs":[{"t":"text","v":"操作人员每年再培训时间不得少于"},{"t":"blank","v":"20学时"},{"t":"text","v":"。"}],"blanks":["20学时"],"full":"操作人员每年再培训时间不得少于20学时。"},{"segs":[{"t":"text","v":"公司应建立HSE培训管理制度，确定安全教育培训主管部门，定期开展岗位"},{"t":"blank","v":"培训需求分析"},{"t":"text","v":"，与业务培训紧密结合，编制"},{"t":"blank","v":"HSE培训计划"},{"t":"text","v":"，按计划进行安全教育培训，对安全培训效果进行评估和改进，做好相关记录。"}],"blanks":["培训需求分析","HSE培训计划"],"full":"公司应建立HSE培训管理制度，确定安全教育培训主管部门，定期开展岗位培训需求分析，与业务培训紧密结合，编制HSE培训计划，按计划进行安全教育培训，对安全培训效果进行评估和改进，做好相关记录。"},{"segs":[{"t":"text","v":"对新员工(包括临时工、合同工、被派遣劳动者、培训和实习人员)必须接受"},{"t":"blank","v":"一、二、三级"},{"t":"text","v":"安全教育，教育时间不少于"},{"t":"blank","v":"72 学时"},{"t":"text","v":"，并建立三级安全教育培训档案。"}],"blanks":["一、二、三级","72 学时"],"full":"对新员工(包括临时工、合同工、被派遣劳动者、培训和实习人员)必须接受一、二、三级安全教育，教育时间不少于72 学时，并建立三级安全教育培训档案。"},{"segs":[{"t":"text","v":"转岗人员、脱岗（一年以上）人员必须接受二级、三级安全教育，教育时间不少于"},{"t":"blank","v":"48学时"},{"t":"text","v":"。"}],"blanks":["48学时"],"full":"转岗人员、脱岗（一年以上）人员必须接受二级、三级安全教育，教育时间不少于48学时。"},{"segs":[{"t":"text","v":"特种作业人员、特种设备作业人员（焊工、加气工等）必须接受"},{"t":"blank","v":"专项培训"},{"t":"text","v":"，取得"},{"t":"blank","v":"相应资格"},{"t":"text","v":"后方可上岗作业，并按期复审。"}],"blanks":["专项培训","相应资格"],"full":"特种作业人员、特种设备作业人员（焊工、加气工等）必须接受专项培训，取得相应资格后方可上岗作业，并按期复审。"},{"segs":[{"t":"text","v":"项目公司应建立特种作业人员和特种设备作业人员"},{"t":"blank","v":"管理台账"},{"t":"text","v":"。"}],"blanks":["管理台账"],"full":"项目公司应建立特种作业人员和特种设备作业人员管理台账。"},{"segs":[{"t":"text","v":"公司主要负责人、安全管理人员、"},{"t":"blank","v":"职业健康管理人员"},{"t":"text","v": text","v":"各单位记录（含电子记录）应填写真实、管理规范、保存完整，"},{"t":"blank","v":"可追溯"},{"t":"text","v":"，并定期开展记录的梳理分析，持续优化整合。"}],"blanks":["可追溯"],"full":"各单位记录（含电子记录）应填写真实、管理规范、保存完整，可追溯，并定期开展记录的梳理分析，持续优化整合。"},{"segs":[{"t":"text","v":"项目公司应落实"},{"t":"blank","v":"消防安全责任制"},{"t":"text","v":"，建立"},{"t":"blank","v":"消防安全管理制度"},{"t":"text","v":"、消防"},{"t":"blank","v":"安全操作规程"},{"t":"text","v":"。"}],"blanks":["消防安全责任制","消防安全管理制度","安全操作规程"],"full":"项目公司应落实消防安全责任制，建立消防安全管理制度、消防安全操作规程。"},{"segs":[{"t":"blank","v":"消防安全管理制度"},{"t":"text","v":"主要包括以下内容：消防安全教育、培训；"},{"t":"blank","v":"防火巡查"},{"t":"text","v":"、检查；安全疏散设施管理；消防(控制室)值班；消防设施、器材维护管理；火灾隐患整改；用火、用电安全管理；易燃易爆危险物品和场所防火防爆；专职和义务消防队的组织管理；灭火和应急疏散预案演练；燃气和电气设备的检查和管理(包括防雷、防静电)；消防安全工作考评和奖惩；其他必要的消防安全内容。"}],"blanks":["消防安全管理制度","防火巡查"],"full":"消防安全管理制度主要包括以下内容：消防安全教育、培训；防火巡查、检查；安全疏散设施管理；消防(控制室)值班；消防设施、器材维护管理；火灾隐患整改；用火、用电安全管理；易燃易爆危险物品和场所防火防爆；专职和义务消防队的组织管理；灭火和应急疏散预案演练；燃气和电气设备的检查和管理(包括防雷、防静电)；消防安全工作考评和奖惩；其他必要的消防安全内容。"},{"segs":[{"t":"text","v":"项目公司应明确"},{"t":"blank","v":"消防安全管理架构"},{"t":"text","v":"、"},{"t":"blank","v":"消防责任人"},{"t":"text","v":"、消防管理人及消防安全岗位责任人。"}],"blanks":["消防安全管理架构","消防责任人"],"full":"项目公司应明确消防安全管理架构、消防责任人、消防管理人及消防安全岗位责任人。"},{"segs":[{"t":"text","v":"项目公司应制定各级消防岗位职责，消防安全责任人、消防安全管理人、消防控制室值班与操作等人员需接受"},{"t":"blank","v":"消防安全培训"},{"t":"text","v":"，有关人员了解其消防职责。"}],"blanks":["消防安全培训"],"full":"项目公司应制定各级消防岗位职责，消防安全责任人、消防安全管理人、消防控制室值班与操作等人员需接受消防安全培训，有关人员了解其消防职责。"},{"segs":[{"t":"text","v":"项目公司根据需要建立"},{"t":"blank","v":"志愿消防队"},{"t":"text","v":"等多种形式的消防组织，并定期组织开展消防理论知识培训和消防应急救援技能训练，培训内容针对性强，记录应齐全完善。"}],"blanks":["志愿消防队"],"full":"项目公司根据需要建立志愿消防队等多种形式的消防组织，并定期组织开展消防理论知识培训和消防应急救援技能训练，培训内容针对性强，记录应齐全完善。"},{"segs":[{"t":"text","v":"消防安全重点单位应当按照灭火和应急疏散预案，至少"},{"t":"blank","v":"每半年"},{"t":"text","v":"进行一次演练，并结合实际，不断完善预案。其他单位应当结合本单位实际，参照制定相应的应急方案，至少每年组织一次演练。"}],"blanks":["每半年"],"full":"消防安全重点单位应当按照灭火和应急疏散预案，至少每半年进行一次演练，并结合实际，不断完善预案。其他单位应当结合本单位实际，参照制定相应的应急方案，至少每年组织一次演练。"},{"segs":[{"t":"text","v":"项目公司消防设施和器材的管理、检查、维修和保养等应设"},{"t":"blank","v":"专人"},{"t":"text","v":"负责，并应定期对其进行检查和补充，消防设施周围不得堆放杂物，消防通道的地面上应有明显的安全标志，安全通道应保持畅通无阻，安全疏散指示标志、应急照明应确保完好。"}],"blanks":["专人"],"full":"项目公司消防设施和器材的管理、检查、维修和保养等应设专人负责，并应定期对其进行检查和补充，消防设施周围不得堆放杂物，消防通道的地面上应有明显的安全标志，安全通道应保持畅通无阻，安全疏散指示标志、应急照明应确保完好。"},{"segs":[{"t":"text","v":"设有自动消防设施的单位应当委托具备相应从业条件的"},{"t":"blank","v":"消防技术服务机构"},{"t":"text","v":"对建筑消防设施每年进行一次全面检测，确保完好有效，检测记录应当完整准确，存档备查。"}],"blanks":["消防技术服务机构"],"full":"设有自动消防设施的单位应当委托具备相应从业条件的消防技术服务机构对建筑消防设施每年进行一次全面检测，确保完好有效，检测记录应当完整准确，存档备查。"},{"segs":[{"t":"text","v":"项目公司应建立健全消防设施与灭火器材档案，记录完整齐全，并形成"},{"t":"blank","v":"闭环管理"},{"t":"text","v":"。"}],"blanks":["闭环管理"],"full":"项目公司应建立健全消防设施与灭火器材档案，记录完整齐全，并形成闭环管理。"},{"segs":[{"t":"text","v":"项目公司应根据需要组织"},{"t":"blank","v":"防火巡查"},{"t":"text","v":"并填写巡查记录，巡查记录表信息应完整、填写准确。"}],"blanks":["防火巡查"],"full":"项目公司应根据需要组织防火巡查并填写巡查记录，巡查记录表信息应完整、填写准确。"},{"segs":[{"t":"text","v":"项目公司应按要求组织开展有针对性的"},{"t":"blank","v":"消防演练"},{"t":"text","v":"，演练频次、内容、方式等符合要求，演练记录齐全，并对"},{"t":"blank","v":"消防演练"},{"t":"text","v":"进行总结或评估，对发现问题制定并落实改进措施。"}],"blanks":["消防演练","消防演练"],"full":"项目公司应按要求组织开展有针对性的消防演练，演练频次、内容、方式等符合要求，演练记录齐全，并对消防演练进行总结或评估，对发现问题制定并落实改进措施。"},{"segs":[{"t":"text","v":"按照“"},{"t":"blank","v":"谁的业务谁负责、谁的属地谁负责"},{"t":"text","v":"”的原则，工程、运营、客服、LPG、危运、行政等部门应全面参与到风险分级管控工作中，组织开展生产作业活动及设备设施梳理，建立生产作业活动清单和设备设施清单，开展业务范围内危害因素辨识工作，建立业务部门"},{"t":"blank","v":"危害因素辨识清单"},{"t":"text","v":"，采用适用工具方法开展风险分析和评估工作，建立本业务的"},{"t":"blank","v":"重大风险清单"},{"t":"text","v":"，明确风险点的责任人和管控措施。"}],"blanks":["谁的业务谁负责、谁的属地谁负责","危害因素辨识清单","重大风险清单"],"full":"按照“谁的业务谁负责、谁的属地谁负责”的原则，工程、运营、客服、LPG、危运、行政等部门应全面参与到风险分级管控工作中，组织开展生产作业活动及设备设施梳理，建立生产作业活动清单和设备设施清单，开展业务范围内危害因素辨识工作，建立业务部门危害因素辨识清单，采用适用工具方法开展风险分析和评估工作，建立本业务的重大风险清单，明确风险点的责任人和管控措施。"},{"segs":[{"t":"text","v":"主管部门统筹各部门开展风险辨识工作，制定工作方案，明确风险等级划分标准和风险评价方法等相关要求，汇编形成项目公司危险源辨识清单和"},{"t":"blank","v":"重大风险清单"},{"t":"text","v":"并督促落实。"}],"blanks":["重大风险清单"],"full":"主管部门统筹各部门开展风险辨识工作，制定工作方案，明确风险等级划分标准和风险评价方法等相关要求，汇编形成项目公司危险源辨识清单和重大风险清单并督促落实。"},{"segs":[{"t":"text","v":"基层岗位员工应积极参与危害因素辨识工作，采取有效方式参与危害因素辨识活动，并熟悉岗位风险、防控措施和"},{"t":"blank","v":"应急措施"},{"t":"text","v":"。"}],"blanks":["应急措施"],"full":"基层岗位员工应积极参与危害因素辨识工作，采取有效方式参与危害因素辨识活动，并熟悉岗位风险、防控措施和应急措施。"},{"segs":[{"t":"text","v":"对识别出的风险应进行分级管控，制定控制措施，包括"},{"t":"blank","v":"工程技术措施"},{"t":"text","v":"、"},{"t":"blank","v":"管理措施"},{"t":"text","v":"、"},{"t":"blank","v":"应急措施"},{"t":"text","v":"和个体防护措施，将总体风险降低至可接受范围内。"}],"blanks":["工程技术措施","管理措施","应急措施"],"full":"对识别出的风险应进行分级管控，制定控制措施，包括工程技术措施、管理措施、应急措施和个体防护措施，将总体风险降低至可接受范围内。"},{"segs":[{"t":"text","v":"项目公司主要负责人应承包本单位"},{"t":"blank","v":"最大风险点"},{"t":"text","v":"，各业务部门负责人应承包本业务的"},{"t":"blank","v":"最大风险点"},{"t":"text","v":"，每季度至少对承包的风险点进行一次检查。"}],"blanks":["最大风险点","最大风险点"],"full":"项目公司主要负责人应承包本单位最大风险点，各业务部门负责人应承包本业务的最大风险点，每季度至少对承包的风险点进行一次检查。"},{"segs":[{"t":"text","v":"项目公司应开展隐患排查治理工作，制定隐患排查治理管理制度，制度中应明确隐患分级和类别，制定隐患排查的时限、范围、内容、频次和要求，建立起全员参与、全岗位覆盖、全过程衔接的隐患排查治理机制，实现隐患排查、登记、评估、报告、监控、治理、销号的全过程记录和"},{"t":"blank","v":"闭环管理"},{"t":"text","v":"。"}],"blanks":["闭环管理"],"full":"项目公司应开展隐患排查治理工作，制定隐患排查治理管理制度，制度中应明确隐患分级和类别，制定隐患排查的时限、范围、内容、频次和要求，建立起全员参与、全岗位覆盖、全过程衔接的隐患排查治理机制，实现隐患排查、登记、评估、报告、监控、治理、销号的全过程记录和闭环管理。"},{"segs":[{"t":"text","v":"组织"},{"t":"blank","v":"专项培训"},{"t":"text","v":"，使员工掌握本岗位及相关岗位安全隐患分级分类、"},{"t":"blank","v":"排查方法"},{"t":"text","v":"、治理措施等内容。项目公司应按照当地主管部门和中燃集团的要求，建立隐患排查治理台账等相应资料；检查方式包括但不限于综合检查、专业检查、季节性检查、节假日检查、日常检查、外聘专家检查等方式。"}],"blanks":["专项培训","排查方法"],"full":"组织专项培训，使员工掌握本岗位及相关岗位安全隐患分级分类、排查方法、治理措施等内容。项目公司应按照当地主管部门和中燃集团的要求，建立隐患排查治理台账等相应资料；检查方式包括但不限于综合检查、专业检查、季节性检查、节假日检查、日常检查、外聘专家检查等方式。"},{"segs":[{"t":"text","v":"隐患排查管理中要求按照“"},{"t":"blank","v":"谁的业务谁负责、谁的属地谁负责"},{"t":"text","v":"”的原则，工程、运营、客服、LPG、危运等部门应全面参与到隐患排查治理工作中。排查的范围包括所有与生产经营相关的场所、环境、人员、设备设施和作业。"}],"blanks":["谁的业务谁负责、谁的属地谁负责"],"full":"隐患排查管理中要求按照“谁的业务谁负责、谁的属地谁负责”的原则，工程、运营、客服、LPG、危运等部门应全面参与到隐患排查治理工作中。排查的范围包括所有与生产经营相关的场所、环境、人员、设备设施和作业。"},{"segs":[{"t":"text","v":"隐患治理管理中要求对排查出的隐患，建立隐患清单，落实"},{"t":"blank","v":"隐患五定"},{"t":"text","v":"，定"},{"t":"blank","v":"整改措施"},{"t":"text","v":"、定整改资金、定整改时间、定整改责任人、定"},{"t":"blank"," /* ============ GitHub 数据同步 ============ */
const GH_TOKEN = ['ghp_','HLS7hblc5dozdhRZr','9qBlv98p0SFLY1Y45Ht'].join('');
const GH_API = 'https://api.github.com/repos/XBW0314/hse-quiz-reports/contents/reports';
const GH_RAW = 'https://raw.githubusercontent.com/XBW0314/hse-quiz-reports/main/reports/';
const GH_HDR = {'Authorization':'token '+GH_TOKEN,'Accept':'application/vnd.github+json'};
const SUMMARY_PATH = GH_API + '/_summary.json';
const CACHE_KEY = 'hse_admin_cache';
const CACHE_TTL = 5 * 60 * 1000; // 5分钟

// 读取汇总（带缓存，1次请求）
async function loadSummary(force){
  const cached = localStorage.getItem(CACHE_KEY);
  if(!force && cached){
    try {
      const c = JSON.parse(cached);
      if(Date.now() - c.ts < CACHE_TTL) return c.data;
    } catch(e){}
  }
  try {
    const r = await fetch(SUMMARY_PATH, {headers:GH_HDR, cache:'no-store'});
    if(!r.ok) return null;
    const d = await r.json();
    const buf = d.content ? JSON.parse(atob(d.content)) : d; // encoded or raw
    const data = buf.users || buf;
    localStorage.setItem(CACHE_KEY, JSON.stringify({ts:Date.now(), data}));
    return data;
  } catch(e){ console.error('loadSummary err:', e); return null; }
}

// 上传个人记录 + 更新汇总
async function uploadToGitHub(){
  if(!currentUser) return;
  const s = statsSummary();
  // 1) 上传个人 JSON
  const userData = {user:currentUser,totalDone:s.done,totalCorrect:s.correct,accuracy:s.acc,lastActive:new Date().toISOString(),records:store};
  const userContent = btoa(unescape(encodeURIComponent(JSON.stringify(userData))));
  const userPath = GH_API + '/' + encodeURIComponent(currentUser) + '.json';

  let ok1 = false;
  try {
    const g = await fetch(userPath, {headers:GH_HDR});
    let shaU = g.ok ? (await g.json()).sha : null;
    const bodyU = {message:'Report:'+currentUser, content:userContent, branch:'main'};
    if(shaU) bodyU.sha = shaU;
    const p = await fetch(userPath, {method:'PUT', headers:GH_HDR, body:JSON.stringify(bodyU)});
    ok1 = p.ok;
  } catch(e){ console.error(e); }

  // 2) 更新汇总文件
  try {
    const g = await fetch(SUMMARY_PATH, {headers:GH_HDR});
    let summary = {users:{}};
    let shaS = null;
    if(g.ok){
      const d = await g.json();
      if(d.content) summary = JSON.parse(atob(d.content));
      shaS = d.sha;
    }
    const entry = {done:s.done,correct:s.correct,acc:s.acc,last:new Date().toISOString()};
    summary.users[currentUser] = entry;
    summary._updated = new Date().toISOString();
    const sumContent = btoa(unescape(encodeURIComponent(JSON.stringify(summary))));
    const bodyS = {message:'Summary update', content:sumContent, branch:'main'};
    if(shaS) bodyS.sha = shaS;
    await fetch(SUMMARY_PATH, {method:'PUT', headers:GH_HDR, body:JSON.stringify(bodyS)});
    localStorage.removeItem(CACHE_KEY); // 清除缓存
  } catch(e){ console.error('summary update err:', e); }

  return ok1;
}

// 读取某个用户的详细记录
async function loadUserDetail(name){
  try {
    const r = await fetch(GH_RAW + '/' + encodeURIComponent(name) + '.json', {cache:'no-store'});

  } catch(e){}

  try {

  } catch(e){}
  return null;
}

/* ============ 用户管理 ============ */
let currentUser = null;
function getLSKey(name){ return 'hse_quiz_v1_'+encodeURIComponent(String(name).trim()); }
function loadStore(name){ try { return JSON.parse(localStorage.getItem(getLSKey(name))) || {}; } catch(e){ return {}; } }
function saveStore(name, s){ localStorage.setItem(getLSKey(name), JSON.stringify(s)); }
let store = {};

function showLogin(callback){
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  ov.innerHTML = '<div class="modal" style="position:relative"><span class="close-btn" id="modalClose">&times;</span>'

    +'<button class="btn btn-primary" id="nameBtn">开始练习</button>'

      div.innerHTML = '<span style="font-weight:600;">'+esc(u)+'</span><span style="font-size:11px;color:#9ca3af;">▶ 进入</span>';

  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
}
function listUsers(){
  const set = new Set();
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    const m = k.match(/^hse_quiz_v1_(.+)$/);
    if(m){ try { set.add(decodeURIComponent(m[1])); } catch(e){} }
  }
  return [...set].sort();
}
function setUser(name){
  currentUser = name;
  store = loadStore(name);
  updateUserBar();
  renderHome();
}
function switchUser(){ showLogin(); }
function updateUserBar(){
  const ubar = document.getElementById('userBar');

/* ============ 二维码 ============ */
function showQR(){
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  const url = location.href.split('?')[0];
  ov.innerHTML = '<div class="modal" style="position:relative"><span class="close-btn" onclick="document.getElementById(\'overlay\').classList.add(\'hidden\')">&times;</span>'
    +'<h2>扫码分享给同事</h2><p>微信扫一扫即可打开</p>'
    +'<div class="qr-wrap"><canvas id="qrCanvas"></canvas></div>'
    +'<div class="qr-url">'+esc(url)+'</div></div>';
  // 画二维码 (简单版, 无需外部依赖)
  drawQR(document.getElementById('qrCanvas'), url, 200);
}
function drawQR(canvas, text, size){
  // 用 Google Charts API 生成二维码图片
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = 'https://api.qrserver.com/v1/create-qr-code/?size='+size+'x'+size+'&data='+encodeURIComponent(text);
  img.onload = function(){
    canvas.width = size; canvas.height = size;
    canvas.getContext('2d').drawImage(img, 0, 0, size, size);
  };
  img.onerror = function(){
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#f3f4f6'; ctx.fillRect(0,0,size,size);
    ctx.fillStyle = '#9ca3af'; ctx.font='13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('二维码加载失败', size/2, size/2);
    ctx.fillText(text, size/2, size/2+30);
  };
}

/* ============ 状态 ============ */
function saveStoreNow(){ saveStore(currentUser, store); }
let session = null;

function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const TYPE_NAMES = { single:'单项选择题', multi:'多项选择题', judge:'判断题', fill:'填空题' };
const TYPE_EMOJI = { single:'📝', multi:'☑️', judge:'⚖️', fill:'✍️' };

/* ---------- 首页 ---------- */
function renderHome(){
  session = null;
  if(!currentUser){ showLogin(function(){ renderHome(); }); return; }
  updateUserBar();
  const s = statsSummary();
  document.getElementById('statsBar').innerHTML =
    `<div class="stat"><b>${s.done}</b>已答题</div>
     <div class="stat"><b>${s.correct}</b>答对</div>
     <div class="stat"><b>${s.acc}</b>正确率</div>`;
  let cards = `
    <h2 style="margin-bottom:12px;font-size:17px;">选择练习模式</h2>
    <div class="mode-grid">
      <div class="mode-card" onclick="startQuiz('exam',false)" style="border-color:#f59e0b;background:#fffbeb;"><div class="icon">🏆</div><h3>模拟考试</h3><p>单选40+多选20+判断20</p><span class="count" style="background:#fef3c7;color:#b45309;">80 题</span></div>
      <div class="mode-card" onclick="startQuiz('single',false)"><div class="icon">📝</div><h3>单项选择</h3><p>四选一</p><span class="count">${DATA.single.length} 题</span></div>
      <div class="mode-card" onclick="startQuiz('multi',false)"><div class="icon">☑️</div><h3>多项选择</h3><p>勾选提交</p><span class="count">${DATA.multi.length} 题</span></div>
      <div class="mode-card" onclick="startQuiz('judge',false)"><div class="icon">⚖️</div><h3>判断题</h3><p>正确/错误</p><span class="count">${DATA.judge.length} 题</span></div>
      <div class="mode-card" onclick="startQuiz('fill',false)"><div class="icon">✍️</div><h3>填空题</h3><p>下划线填写</p><span class="count">${DATA.fill.length} 题</span></div>
      <div class="mode-card" onclick="startQuiz('wrong',false)"><div class="icon">🔁</div><h3>错题重练</h3><p>只练错题</p><span class="count" id="wrongCount">${countWrong()} 题</span></div>`;
  // 许博文管理入口
  if(currentUser === '许博文'){
    cards += `<div class="mode-card" onclick="renderAdmin()" style="border-color:#8b5cf6;background:#faf5ff;"><div class="icon">📊</div><h3>管理面板</h3><p>查看全员练习记录</p><span class="count" style="background:#ede9fe;color:#6d28d9;">${listUsers().length} 人</span></div>`;
  }
  cards += `</div>
    <div style="text-align:center;margin-top:18px;">
      <button class="btn btn-ghost" onclick="resetProgress()">清空我的练习记录</button>
    </div>`;
  document.getElementById('app').innerHTML = cards;
}

function statsSummary(){
  let done = 0, correct = 0;
  for(const k in store){ if(store[k] && store[k].done){ done++; if(store[k].ok) correct++; } }
  const acc = done ? Math.round(correct/done*100)+'%' : '—';
  return {done, correct, acc};
}
function countWrong(){
  let n = 0;
  for(const k in store){ if(store[k] && store[k].done && !store[k].ok) n++; }
  return n;
}
function resetProgress(){
  if(!confirm('确定清空 '+currentUser+' 的所有练习记录吗？')) return;
  store = {}; saveStoreNow(); renderHome();
}

/* ---------- 开始练习 ---------- */
function startQuiz(type, mixed){
  let items = [];
  if(type === 'wrong'){
    for(const k in store){
      if(store[k] && store[k].done && !store[k].ok){
        const [t, idx] = k.split('_');
        if(DATA[t]) items.push({type:t, idx:+idx});
      }
    }
    if(!items.length){ alert('暂无错题，先去练习吧！'); return; }
    items = shuffle(items);
  } else if(type === 'mixed' || type === 'exam'){
    // exam: 1-40 随机单选, 41-60 随机多选, 61-80 随机判断
    // mixed(保留兼容): 随机混合各题型
    if(type === 'exam'){
      const s = shuffle(DATA.single.map((_,i)=>({type:'single', idx:i}))).slice(0, 40);
      const m = shuffle(DATA.multi.map((_,i)=>({type:'multi', idx:i}))).slice(0, 20);
      const j = shuffle(DATA.judge.map((_,i)=>({type:'judge', idx:i}))).slice(0, 20);
      items = [...s, ...m, ...j];
    } else {
      const pool = [];
      ['single','multi','judge','fill'].forEach(t => DATA[t].forEach((_,i)=>pool.push({type:t, idx:i})));
      items = shuffle(pool).slice(0, 20);
    }
  } else {
    items = DATA[type].map((_,i)=>({type, idx:i}));
  }
  session = { items, pos:0, correctCount:0, wrongList:[], answered:false, examMode:(type === 'exam') };
  renderQuestion();
}

/* ---------- 渲染题目 ---------- */
function renderQuestion(){
  const total = session.items.length;
  const cur = session.items[session.pos];
  const prog = Math.round(session.pos/total*100);
  const item = DATA[cur.type][cur.idx];

  let body = `<div class="toolbar">
      <button class="btn btn-ghost" onclick="renderHome()">← 返回</button>
      <span class="progress-text">${TYPE_EMOJI[cur.type]} 第 ${session.pos+1}/${total} 题 · 已对 ${session.correctCount}</span>
    </div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${prog}%"></div></div>`;

  // 模拟考试分段标题
  if(session.examMode){
    if(session.pos === 0) body += '<div style="text-align:center;padding:14px 0 8px;color:#0f3d7a;font-size:17px;font-weight:700;border-bottom:2px solid #2563eb;margin-bottom:14px;">📝 一、单项选择题 （第 1-40 题）</div>';
    else if(session.pos === 40) body += '<div style="text-align:center;padding:14px 0 8px;color:#0f3d7a;font-size:17px;font-weight:700;border-bottom:2px solid #2563eb;margin-bottom:14px;">☑️ 二、多项选择题 （第 41-60 题）</div>';
    else if(session.pos === 60) body += '<div style="text-align:center;padding:14px 0 8px;color:#0f3d7a;font-size:17px;font-weight:700;border-bottom:2px solid #2563eb;margin-bottom:14px;">⚖️ 三、判断题 （第 61-80 题）</div>';
  }

  body += `<span class="q-type">${TYPE_NAMES[cur.type]}</span>`;

  if(cur.type === 'fill'){
    body += renderFillBody(item);
  } else {
    body += `<div class="q-text">${esc(item.q)}</div>`;
    if(cur.type === 'judge'){
      body += `<div class="judge-btns">
          <button class="judge-btn" id="jtrue" onclick="answerJudge(true)">✓ 正确</button>
          <button class="judge-btn" id="jfalse" onclick="answerJudge(false)">✗ 错误</button>
        </div>`;
    } else if(cur.type === 'single'){
      for(const k of Object.keys(item.options)){
        body += `<div class="opt" id="opt_${k}" onclick="answerSingle('${k}')">
          <span class="letter">${k}</span><span>${esc(item.options[k])}</span></div>`;
      }
    } else {
      body += `<div class="multi-hint">本题为多选，请选择所有正确选项后点击「提交答案」</div>`;
      for(const k of Object.keys(item.options)){
        body += `<div class="opt" id="opt_${k}" onclick="toggleMulti('${k}')">
          <span class="letter">${k}</span><span>${esc(item.options[k])}</span></div>`;
      }
      body += `<div class="submit-row"><button class="btn btn-primary" id="submitBtn" onclick="answerMulti()">提交答案</button></div>`;
    }
  }

  body += `<div class="feedback" id="feedback"></div>
    <div class="nav">
      <span></span>
      <button class="btn btn-primary" id="nextBtn" style="display:none" onclick="nextQuestion()">下一题 →</button>
    </div>`;
  document.getElementById('app').innerHTML = body;
  session.answered = false;
  session.multiSel = new Set();
  if(cur.type === 'fill'){
    const first = document.querySelector('.blank-input');
    if(first) first.focus();
  }
  window.scrollTo(0, 0);
}

/* ---------- 填空题 ---------- */
function renderFillBody(item){
  let html = '<div class="fill-sentence">';
  let bi = 0;
  for(const seg of item.segs){
    if(seg.t === 'text'){
      html += esc(seg.v);
    } else {
      const w = Math.min(Math.max(seg.v.length * 1.05, 3), 16);
      html += `<input class="blank-input" id="blank_${bi}" data-ans="${esc(seg.v)}"
        style="width:${w}em" placeholder="﹏﹏﹏" autocomplete="off">`;
      bi++;
    }
  }
  html += '</div>';
  html += `<div class="multi-hint" style="margin-top:8px;">在 <u>下划线</u> 处填写答案，共 ${item.blanks.length} 空</div>`;
  html += `<div class="fill-tools">
      <button class="btn btn-primary" id="fillSubmit" onclick="answerFill()">提交答案</button>
      <button class="btn btn-ghost" onclick="revealFill()">显示答案</button>
    </div>`;
  html += `<div class="fill-fullext" id="fillFull"></div>`;
  return html;
}

function normAnswer(s){
  return String(s).replace(/[\\s　]+/g,'').replace(/[，、,.．。；;：:（）()［］\[\]【】]/g,'').toLowerCase();
}

function answerFill(){
  if(session.answered) return;
  const cur = session.items[session.pos];
  const item = DATA.fill[cur.idx];
  const inputs = document.querySelectorAll('.blank-input');
  let allEmpty = true, allOk = true;
  inputs.forEach(inp => {
    const user = inp.value.trim();
    if(user) allEmpty = false;
    const ok = normAnswer(user) === normAnswer(inp.dataset.ans);
    inp.classList.remove('ok','bad');
    inp.classList.add(ok ? 'ok' : 'bad');
    if(!ok) allOk = false;
  });
  if(allEmpty){ alert('请先填写答案'); return; }
  let wrongAns = [];
  inputs.forEach(inp => { if(inp.classList.contains('bad')) wrongAns.push(inp.dataset.ans); });
  showFeedback(allOk, wrongAns.join('；'));
  if(!allOk){
    inputs.forEach(inp => {
      if(inp.classList.contains('bad') && !inp.nextElementSibling?.classList?.contains('blank-answer')){
        const sp = document.createElement('span');
        sp.className = 'blank-answer';
        sp.textContent = '→ ' + inp.dataset.ans;
        inp.after(sp);
      }
    });
  }
  record('fill_'+cur.idx, allOk);
  finishAnswer(allOk);
  if(document.getElementById('fillSubmit')) document.getElementById('fillSubmit').disabled = true;
}

function revealFill(){
  const cur = session.items[session.pos];
  const item = DATA.fill[cur.idx];
  const ff = document.getElementById('fillFull');
  ff.classList.add('show');
  ff.innerHTML = '<b>完整原文：</b>' + esc(item.full);
  document.querySelectorAll('.blank-input').forEach(inp => {
    if(!inp.value.trim()) inp.value = inp.dataset.ans;
  });
}

/* ---------- 判分(选择/判断) ---------- */
function markOptions(item, pickedSet, isMulti){
  for(const k of Object.keys(item.options)){
    const el = document.getElementById('opt_'+k);
    el.classList.add('locked');
    const isAns = isMulti ? item.answer.includes(k) : item.answer === k;
    if(isAns) el.classList.add('correct');
    else if(pickedSet.has(k)) el.classList.add('wrong');
  }
}
function showFeedback(ok, ansText){
  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (ok ? 'ok' : 'bad');
  fb.innerHTML = ok
    ? '✅ <b>回答正确，通过！</b>'
    : '❌ <b>回答错误</b><br>正确答案：<span class="ans">' + esc(ansText) + '</span>';
  document.getElementById('nextBtn').style.display = 'inline-block';
}
function record(key, ok){
  store[key] = {done:true, ok:ok, ts:Date.now()};
  saveStoreNow();
}
function finishAnswer(ok){
  session.answered = true;
  if(ok) session.correctCount++;
  else session.wrongList.push(session.items[session.pos]);
}

function answerSingle(k){
  if(session.answered) return;
  const cur = session.items[session.pos];
  const item = DATA.single[cur.idx];
  document.getElementById('opt_'+k).classList.add('selected');
  markOptions(item, new Set([k]), false);
  const ok = (k === item.answer);
  showFeedback(ok, item.answer+'、'+esc(item.options[item.answer]));
  record('single_'+cur.idx, ok);
  finishAnswer(ok);
}

function toggleMulti(k){
  if(session.answered) return;
  const el = document.getElementById('opt_'+k);
  if(session.multiSel.has(k)){ session.multiSel.delete(k); el.classList.remove('selected'); }
  else { session.multiSel.add(k); el.classList.add('selected'); }
}
function answerMulti(){
  if(session.answered) return;
  if(!session.multiSel.size){ alert('请先选择选项'); return; }
  const cur = session.items[session.pos];
  const item = DATA.multi[cur.idx];
  const sel = [...session.multiSel].sort();
  const ans = item.answer.slice().sort();
  const ok = sel.length === ans.length && sel.every((v,i)=>v===ans[i]);
  markOptions(item, session.multiSel, true);
  const ansText = ans.map(k=>esc(k+'、'+item.options[k])).join('；');
  showFeedback(ok, ans.join('') + ' —— ' + ansText);
  record('multi_'+cur.idx, ok);
  finishAnswer(ok);
  document.getElementById('submitBtn').disabled = true;
}

function answerJudge(val){
  if(session.answered) return;
  const cur = session.items[session.pos];
  const item = DATA.judge[cur.idx];
  const ok = (val === item.answer);
  const bt = document.getElementById('jtrue'), bf = document.getElementById('jfalse');
  bt.classList.add('locked'); bf.classList.add('locked');
  (val ? bt : bf).classList.add('selected');
  (item.answer ? bt : bf).classList.add('correct');
  if(!ok) (val ? bt : bf).classList.add('wrong');
  showFeedback(ok, item.answer ? '正确' : '错误');
  record('judge_'+cur.idx, ok);
  finishAnswer(ok);
}

/* ---------- 下一题 / 结算 ---------- */
function nextQuestion(){
  session.pos++;
  if(session.pos >= session.items.length){ renderResult(); return; }
  renderQuestion();
}
function renderResult(){
  const total = session.items.length;
  const ok = session.correctCount;
  const pct = Math.round(ok/total*100);
  let wrongHtml = '';
  if(session.wrongList.length){
    wrongHtml = '<div class="wrong-list"><h3 style="margin-bottom:10px;">本次错题回顾</h3>';
    for(const w of session.wrongList){
      const item = DATA[w.type][w.idx];
      let qText, ansText;
      if(w.type === 'fill'){ qText = item.full; ansText = item.blanks.join('；'); }
      else {
        qText = item.q;
        if(w.type==='single') ansText = item.answer+'、'+esc(item.options[item.answer]);
        else if(w.type==='multi') ansText = item.answer.map(k=>k+'、'+item.options[k]).join('；');
        else ansText = item.answer ? '正确' : '错误';
      }
      wrongHtml += '<div class="wrong-item">【'+TYPE_NAMES[w.type]+'】'+esc(qText)+'<br><span class="a">正确答案：'+esc(ansText)+'</span></div>';
    }
    wrongHtml += '</div>';
  }
  document.getElementById('app').innerHTML = `
    <div class="result-box">
      <div class="score">${pct}<span style="font-size:22px;">分</span></div>
      <div class="sub">共 ${total} 题 · 答对 ${ok} 题 · 答错 ${total-ok} 题</div>
      <button class="btn btn-primary" onclick="renderHome()">返回首页</button>
      ${session.wrongList.length ? '<button class="btn btn-ghost" onclick="retrySessionWrong()">重练本次错题</button>' : ''}
      <button class="btn btn-ghost" onclick="doUpload()" style="background:#fef3c7;color:#92400e;">📤 上报成绩到云端</button>
      ${wrongHtml}
    </div>`;
  updateUserBar();
  document.getElementById('statsBar').innerHTML = (()=>{ const s=statsSummary();
    return '<div class="stat"><b>'+s.done+'</b>已答题</div><div class="stat"><b>'+s.correct+'</b>答对</div><div class="stat"><b>'+s.acc+'</b>正确率</div>'; })();
  window.scrollTo(0, 0);
}
function retrySessionWrong(){
  const items = shuffle(session.wrongList.slice());
  session = { items, pos:0, correctCount:0, wrongList:[], answered:false, examMode:false };
  renderQuestion();
}

/* ============ 管理面板（许博文专属） ============ */
async function renderAdmin(forceRefresh){
  if(currentUser !== '许博文'){ renderHome(); return; }
  session = null;
  updateUserBar();
  document.getElementById('statsBar').innerHTML = '';
  document.getElementById('app').innerHTML = '<div style="text-align:center;padding:40px;color:#6b7280;">⏳ 正在从云端加载数据...</div>';

  let summary = await loadSummary(forceRefresh);
  let source = '（云端汇总 · 5分钟内缓存）';
  let usersArr = [];

  if(summary && summary.users){
    for(const [name, u] of Object.entries(summary.users)){
      usersArr.push({user:name, totalDone:u.done||0, totalCorrect:u.correct||0, accuracy:u.acc||'—', lastActive:u.last||null});
    }
    usersArr.sort((a,b) => (b.totalDone||0) - (a.totalDone||0));
  }
  if(!usersArr.length){
    // 回退本地
    const local = listUsers().map(u => { const s=loadStore(u); let d=0,c=0; for(const k in s){ if(s[k]&&s[k].done){ d++; if(s[k].ok)c++; } } return {user:u,totalDone:d,totalCorrect:c,accuracy:d?Math.round(c/d*100)+'%':'—',lastActive:lastActivity(s),records:s}; });
    usersArr = local;
    source = forceRefresh ? '（暂未有人上报，显示本地数据）' : '（云端无数据/网络异常，显示本地数据）';
  }

  let rows='', totalDone=0, totalCorrect=0;
  for(const u of usersArr){
    totalDone+=(u.totalDone||0); totalCorrect+=(u.totalCorrect||0);
    const acc = u.accuracy || (u.totalDone?Math.round(u.totalCorrect/u.totalDone*100)+'%':'—');
    rows += `<tr style="border-bottom:1px solid #e5e7eb;cursor:pointer;" onclick="viewUserCloud('${esc(u.user)}')">
      <td style="padding:10px;font-weight:600;">${esc(u.user)}</td>
      <td style="padding:10px;text-align:center;">${u.totalDone||0}</td>
      <td style="padding:10px;text-align:center;">${u.totalCorrect||0}</td>
      <td style="padding:10px;text-align:center;color:${u.totalDone&&u.totalCorrect/u.totalDone>=0.6?'#16a34a':'#dc2626'};">${acc}</td>
      <td style="padding:10px;text-align:center;font-size:12px;color:#9ca3af;">${u.lastActive?fmtTime(u.lastActive):'—'}</td>
    </tr>`;
  }
  document.getElementById('app').innerHTML = `
    <div class="toolbar"><button class="btn btn-ghost" onclick="renderHome()">← 返回首页</button>
      <span style="color:#6b7280;font-size:13px;">${usersArr.length} 人 · 总答题 ${totalDone} · 总答对 ${totalCorrect} ${source}</span>
    </div>
    <h2 style="margin-bottom:6px;font-size:17px;">📊 全员练习记录</h2>
    <p style="font-size:12px;color:#9ca3af;margin-bottom:12px;">点击姓名查看详细记录 · 每人需在自己设备点击「📤 上报成绩」同步</p>
    <div style="overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <thead><tr style="background:#f8fafc;text-align:left;color:#6b7280;font-size:12px;">
        <th style="padding:8px 10px;">姓名</th><th style="padding:8px 10px;text-align:center;">已答题</th>
        <th style="padding:8px 10px;text-align:center;">答对</th><th style="padding:8px 10px;text-align:center;">正确率</th>
        <th style="padding:8px 10px;text-align:center;">最近活动</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div style="text-align:center;margin-top:16px;">
      <button class="btn btn-primary" onclick="renderAdmin(true)">🔄 强制刷新（忽略缓存）</button>
    </div>`;
  window.scrollTo(0, 0);
}
function fmtTime(ts){ if(!ts) return '—'; const d=new Date(ts); return d.getMonth()+1+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }

async function viewUserCloud(name){
  document.getElementById('app').innerHTML = '<div style="text-align:center;padding:40px;color:#6b7280;">⏳ 加载中...</div>';
  let data = await loadUserDetail(name);
  if(!data){
    const s = loadStore(name);
    let d=0,c=0;
    for(const k in s){ if(s[k]&&s[k].done){ d++; if(s[k].ok) c++; } }
    data = {user:name, totalDone:d, totalCorrect:c, records:s};
  }
  renderUserDetail(name, data);
}
function renderUserDetail(name, data){
  const records = data.records || {};
  let items = '';
  const keys = Object.keys(records).sort((a,b)=>(records[b].ts||0)-(records[a].ts||0));
  if(!keys.length) items = '<p style="color:#9ca3af;">暂无练习记录</p>';
  else {
    for(const k of keys){
      const v = records[k];
      if(!v.done) continue;
      const [t, idx] = k.split('_');
      const typeName = TYPE_NAMES[t] || t;
      const icon = v.ok ? '✅' : '❌';
      let qText = '';
      if(t==='fill'){ qText = (DATA[t][+idx]||{}).full || '—'; }
      else { qText = (DATA[t] && DATA[t][+idx]) ? DATA[t][+idx].q : '—'; }
      const time = v.ts ? new Date(v.ts).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
      items += `<div style="border:1px solid ${v.ok?'#d1fae5':'#fee2e2'};background:${v.ok?'#f0fdf4':'#fef2f2'};border-radius:6px;padding:8px 12px;margin-bottom:6px;font-size:13px;">
        ${icon} 【${typeName}】${esc(qText).substring(0, 80)}${qText&&qText.length>80?'...':''} <span style="color:#9ca3af;font-size:11px;float:right;">${time}</span></div>`;
    }
  }
  document.getElementById('app').innerHTML = `
    <div class="toolbar"><button class="btn btn-ghost" onclick="renderAdmin()">← 返回列表</button>
      <span style="font-size:14px;font-weight:600;">${esc(name)} · 已答 ${data.totalDone||0} · 答对 ${data.totalCorrect||0}</span></div>
    ${items}`;
  window.scrollTo(0, 0);
}

document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter' || !session || !currentUser) return;
  if(!session.answered){
    const cur = session.items[session.pos];
    if(cur.type === 'multi') answerMulti();
    else if(cur.type === 'fill') answerFill();
  } else {
    nextQuestion();
  }
});

// 启动
(function(){
  const users = listUsers();
  if(users.length === 1){
    setUser(users[0]); // 自动登录唯一用户
  } else {
    showLogin(); // 多用户或无用户时显示登录
  }
})();
</script>
</body>
</html>
